<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Sai Tasty Foods</title>

    <link rel="stylesheet" href="./admin.css">

</head>

<body class="admin-login-body">

    <div class="admin-login-container">

        <div class="admin-login-box">


            <h1>
                SAI TASTY FOODS
            </h1>

            <h2>
                Admin Login
            </h2>

            <div class="input-group">

                <label for="adminUsername">
                    Admin Email
                </label>

                <input
                    type="email"
                    id="adminUsername"
                    placeholder="Enter admin email">

            </div>


            <div class="input-group">

                <label for="adminPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Enter password">

            </div>


            <button
                class="admin-login-button"
                onclick="adminLogin()">

                 Login

            </button>


            <p id="adminMessage"></p>


            <p class="admin-security">
                🔒 Admin access only
            </p>

        </div>

    </div>


    <script src="./admin.js"></script>

</body>

</html>
