<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Account - Sai Tasty Foods</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <!-- HEADER -->
    <header>

        <div class="logo">
            SAI TASTY FOODS
        </div>

        <nav>

            <a href="index.html">Home</a>

            <a href="#">Restaurants</a>

            <a href="cart.html" class="cart-link">
                🛒 Cart
                <span id="cartCount" class="cart-badge">0</span>
            </a>

            <!-- USER ACCOUNT -->
            <div class="user-account" id="userAccount">

                <button class="user-button"
                        onclick="toggleUserMenu()">

                    👤 <span id="userName">User</span> ▼

                </button>

                <div class="user-menu" id="userMenu">

                    <div class="user-menu-name">

                        👤 <span id="menuUserName">User</span>

                    </div>

                    <a href="account.html">
                        My Account
                    </a>

                    <a href="orders.html">
                        My Orders
                    </a>
                    <a href="addresses.html">
                        Address
                    </a>
                    <button onclick="logoutUser()">
                        Logout
                    </button>

                </div>

            </div>

        </nav>

    </header>


    <!-- ACCOUNT SECTION -->

    <section class="account-container">

        <h1>My Account</h1>

        <div class="account-card">

            <div class="account-icon">
                👤
            </div>

            <h2 id="accountName">User</h2>

            <div id="accountViewMode">
                <p>
                    <strong>Email:</strong>
                    <span id="accountEmail"></span>
                </p>

                <p>
                    <strong>Phone:</strong>
                    <span id="accountPhone">Not provided</span>
                </p>


                <button type="button" id="editProfileBtn">
                    Edit Profile
                </button>
            </div>

            <div id="accountEditMode" style="display: none;">

                <label for="editAccountName">Name</label>
                <input
                    type="text"
                    id="editAccountName"
                    maxlength="150"
                    required
                >

                <label for="editAccountPhone">Phone Number</label>
                <input
                    type="tel"
                    id="editAccountPhone"
                    maxlength="10"
                    inputmode="numeric"
                    pattern="[0-9]{10}"
                    placeholder="Enter 10-digit phone number"
                    required
                >

                <p>
                    <strong>Email:</strong>
                    <span id="editAccountEmail"></span>
                </p>

                <button type="button" id="saveProfileBtn">
                    Save Changes
                </button>

                <button type="button" id="cancelProfileBtn">
                    Cancel
                </button>

                <p id="profileMessage" role="status"></p>

            </div>

        </div>

    </section>


    <script src="./script.js"></script>

    <script>

        // Display user details

        
        let user = JSON.parse(
            localStorage.getItem("currentUser") || "null"
        );

        const isLoggedIn = localStorage.getItem("isLoggedIn");

        const accountName = document.getElementById("accountName");
        const accountEmail = document.getElementById("accountEmail");
        const accountPhone = document.getElementById("accountPhone");

        const accountViewMode = document.getElementById("accountViewMode");
        const accountEditMode = document.getElementById("accountEditMode");

        const editAccountName = document.getElementById("editAccountName");
        const editAccountPhone = document.getElementById("editAccountPhone");
        const editAccountEmail = document.getElementById("editAccountEmail");

        const editProfileBtn = document.getElementById("editProfileBtn");
        const saveProfileBtn = document.getElementById("saveProfileBtn");
        const cancelProfileBtn = document.getElementById("cancelProfileBtn");
        const profileMessage = document.getElementById("profileMessage");

        if (isLoggedIn !== "true" || !user) {
            window.location.href = "login.html";
        } else {
            accountName.textContent = user.name || "User";
            accountEmail.textContent = user.email || "";
            accountPhone.textContent = user.phone || "Not provided";
            editAccountEmail.textContent = user.email || "";
        }

        editProfileBtn.addEventListener("click", function () {
            editAccountName.value = user.name || "";
            editAccountPhone.value = user.phone || "";

            profileMessage.textContent = "";
            accountViewMode.style.display = "none";
            accountEditMode.style.display = "block";
        });

        cancelProfileBtn.addEventListener("click", function () {
            accountEditMode.style.display = "none";
            accountViewMode.style.display = "block";
            profileMessage.textContent = "";
        });

        saveProfileBtn.addEventListener("click", async function () {
            const name = editAccountName.value.trim();
            const phone = editAccountPhone.value.trim();

            if (!name) {
                profileMessage.textContent = "Please enter your name.";
                profileMessage.style.color = "#e63946";
                return;
            }

            if (!/^[0-9]{10}$/.test(phone)) {
                profileMessage.textContent =
                    "Enter a valid 10-digit phone number.";
                profileMessage.style.color = "#e63946";
                return;
            }

            if (!user.id) {
                profileMessage.textContent =
                    "User ID is missing. Please log out and log in again.";
                profileMessage.style.color = "#e63946";
                return;
            }

            saveProfileBtn.disabled = true;
            saveProfileBtn.textContent = "Saving...";

            try {
                const response = await fetch(
                    `${API_BASE_URL}/api/update-user-profile/`,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            user_id: user.id,
                            name: name,
                            phone: phone
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(
                        data.message || "Unable to update profile."
                    );
                }

                user = { ...user, ...data.user };

                localStorage.setItem(
                    "currentUser",
                    JSON.stringify(user)
                );

                accountName.textContent = user.name || "User";
                accountEmail.textContent = user.email || "";
                accountPhone.textContent = user.phone || "Not provided";
                editAccountEmail.textContent = user.email || "";

                accountEditMode.style.display = "none";
                accountViewMode.style.display = "block";

                profileMessage.textContent = "";
                alert("Profile updated successfully!");

            } catch (error) {
                console.error("Profile update error:", error);

                profileMessage.textContent =
                    error.message || "Unable to update profile.";
                profileMessage.style.color = "#e63946";

            } finally {
                saveProfileBtn.disabled = false;
                saveProfileBtn.textContent = "Save Changes";
            }
        });

    </script>

</body>

</html>
