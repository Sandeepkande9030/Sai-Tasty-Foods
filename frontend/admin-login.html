<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Sai Tasty Foods</title>

    <link rel="stylesheet" href="./admin.css">
</head>

<body class="admin-login-body">

    <div class="admin-login-box">

        <h1>SAI TASTY FOODS</h1>

        <h2>Admin Login</h2>

        <input type="text"
               id="adminUsername"
               placeholder="Admin Username">

        <input type="password"
               id="adminPassword"
               placeholder="Admin Password">

        <button onclick="adminLogin()">
            Login
        </button>

        <p id="adminMessage"></p>

    </div>

    <script src="./admin.js"></script>

</body>

</html>
