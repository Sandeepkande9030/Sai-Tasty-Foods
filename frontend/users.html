<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Users - Sai Tasty Foods</title>

<link rel="stylesheet" href="./admin.css">


</head>

<body class="admin-dashboard-body">

<!-- =========================
     SIDEBAR
========================== -->

<aside class="admin-sidebar">

    <div class="admin-logo">
        SAI TASTY FOODS
    </div>


    <nav class="admin-nav">

        <a href="admin-dashboard.html">
            🏠 Dashboard
        </a>

        <a href="users.html"
           class="active">
            👥 Users
        </a>

        <a href="admin-restaurants.html">
            🍽️ Restaurants
        </a>
        <a href="restaurant-permissions.html">
            🔐 Restaurant Permissions
        </a>

        <a href="food-items.html">
            🍔 Food Items
        </a>

        <a href="admin-orders.html">
            📦 Orders
        </a>

        
    </nav>


    <button
        class="admin-logout-button"
        onclick="adminLogout()">

        🚪 Logout

    </button>

</aside>



<!-- =========================
     MAIN CONTENT
========================== -->

<main class="admin-main">
    <!-- =========================
            PRINT HEADER
        ========================== -->

        <div class="print-header">

            <h1>SAI TASTY FOODS</h1>

            <div class="print-date-time">

                <div id="printDate"></div>

                <div id="printTime"></div>

            </div>

        </div>


    <!-- TOP BAR -->

    <header class="admin-topbar">

        <div>

            <h1>
                Users
            </h1>

            <p>
                Manage registered customers
            </p>

        </div>


        <div class="admin-profile">

            <div class="admin-profile-icon">
                A
            </div>

            <div>

                <strong id="adminName">
                    Admin
                </strong>

                <span>
                    Administrator
                </span>

            </div>

        </div>

    </header>



    <!-- =========================
         USERS TABLE
    ========================== -->

    <section class="orders-section">


        <div class="section-header">

            <div>

                <h2>
                    Registered Users
                </h2>

                <p>
                    All customers registered in Sai Tasty Foods
                </p>

            </div>
            <button
                type="button"
                onclick="printUsers()"
                class="print-button">

                🖨️ Print 

            </button>

        </div>


        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>
                            S.No
                        </th>

                        <th>
                            Name
                        </th>

                        <th>
                            Email
                        </th>
                        <th>
                            Phone Number
                        </th>
                        <th>
                            Status
                        </th>

                    </tr>

                </thead>


                <tbody id="userTable">

                </tbody>

            </table>

        </div>


    </section>


</main>



<!-- ADMIN JAVASCRIPT -->

<script src="./admin.js"></script>


</body>

</html>
