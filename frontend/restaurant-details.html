<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Restaurant Details - Sai Tasty Foods</title>

    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>

</head>

<body>

    <header>

        <div class="logo">
            SAI TASTY FOODS
        </div>

        <nav>

            <a href="index.html">Home</a>

            <a href="restaurants.html">Restaurants</a>

            <a href="#">Offers</a>

            

            <a href="login.html"
               id="loginLink">

                Login

            </a>

        </nav>

    </header>


    <section class="food-section">

        <h2 id="restaurantName">
            Loading...
        </h2>

        <div id="restaurantDetails">

            <p>Loading restaurant details...</p>

        </div>

    </section>


    <script>

        async function loadRestaurant() {

            const params =
                new URLSearchParams(window.location.search);

            const restaurantId =
                params.get("id");


            if (!restaurantId) {

                document.getElementById("restaurantDetails").innerHTML =
                    "<p>Restaurant not found.</p>";

                return;

            }


            try {

                const response =
                    await fetch(
                        "https://backend-dl8i.vercel.app/api/restaurants/"
                    );


                const data =
                    await response.json();


                if (!data.success) {

                    document.getElementById("restaurantDetails").innerHTML =
                        "<p>Unable to load restaurant.</p>";

                    return;

                }


                const restaurant =
                    data.restaurants.find(
                        function(item) {

                            return item.id == restaurantId;

                        }
                    );


                if (!restaurant) {

                    document.getElementById("restaurantDetails").innerHTML =
                        "<p>Restaurant not found.</p>";

                    return;

                }


                document.getElementById("restaurantName").innerText =
                    restaurant.name;


                document.getElementById("restaurantDetails").innerHTML = `

                    <div class="food-card">

                        <img
                            src="${restaurant.image}"
                            alt="${restaurant.name}"
                        >

                        <div class="food-info">

                            <h3>
                                ${restaurant.name}
                            </h3>

                            <p>
                                ${restaurant.description}
                            </p>

                            <p>
                                🍴 Cuisine:
                                ${restaurant.cuisine}
                            </p>

                            <p>
                                ⭐ Rating:
                                ${restaurant.rating}
                            </p>

                            <p>
                                🛵 Delivery:
                                ${restaurant.delivery_time}
                            </p>

                            <p>
                                📍 Location:
                                ${restaurant.location}
                            </p>

                            <button onclick="goBack()">
                                ← Back to Restaurants
                            </button>

                        </div>
<h2 style="margin-top: 40px;">
    Food Menu
</h2>

<div class="food-container" id="foodMenu">

    
        </div>

                
                `;
                    loadFoodMenu(restaurantId);

                            }

            catch (error) {
                console.error(error);

                document.getElementById("restaurantDetails").innerHTML =
                    "<p>Unable to connect to server.</p>";

            }

        }
        async function loadFoodMenu(restaurantId) {

    const foodMenu = document.getElementById("foodMenu");

    foodMenu.innerHTML = `
        <p style="text-align:center;">
            Loading food items...
        </p>
    `;

    try {

        const response = await fetch(
            `${API_BASE_URL}/api/restaurant-food-items/?restaurant_id=${restaurantId}`
        );

        const data = await response.json();

        console.log("Database food items:", data);

        if (!data.success) {
            foodMenu.innerHTML = `
                <p style="text-align:center;">
                    Unable to load food items.
                </p>
            `;
            return;
        }

        const foods = data.food_items || [];

        if (foods.length === 0) {
            foodMenu.innerHTML = `
                <p style="text-align:center;">
                    No food items available.
                </p>
            `;
            return;
        }

        foodMenu.innerHTML = foods.map(food => {

            let image = food.image;

            /*
             * Local images
             */
            if (image && image.startsWith("./images/")) {
                image = image;
            }

            /*
             * If image is empty
             */
            if (!image) {
                image = "./images/food-background.jpg";
            }

            return `
                <div class="food-card">

                    <img
                        src="${image}"
                        alt="${food.name}"
                        class="food-image"
                        onerror="this.src='./images/food-background.jpg'"
                    >

                    <div class="food-info">

                        <h3>${food.name}</h3>

                        <p>
                            ${food.description || ""}
                        </p>

                        <span>
                            ₹${Number(food.price).toFixed(2)}
                        </span>

                        <button
                            onclick="addFoodToCart(
                                '${food.name.replace(/'/g, "\\'")}',
                                ${Number(food.price)}
                            )"
                        >
                            Add to Cart
                        </button>

                    </div>

                </div>
            `;

        }).join("");

    } catch (error) {

        console.error("Food menu error:", error);

        foodMenu.innerHTML = `
            <p style="text-align:center;">
                Unable to connect to server.
            </p>
        `;
    }
}
       async function loadFoodMenu(restaurantId) {

    try {

        const response = await fetch(
            "https://backend-dl8i.vercel.app/api/restaurant-food-items/?restaurant_id=" +
            restaurantId
        );

        const data = await response.json();

        if (!data.success || data.food_items.length === 0) {
            return;
        }

        const foodMenu =
            document.getElementById("foodMenu");

        foodMenu.innerHTML = "";

        data.food_items.forEach(function(food) {

            let imagePath = food.image;

            if (!imagePath) {
                imagePath = "./images/food-background.jpg";
            }

            // Convert local Windows image path
            if (imagePath.includes("C:\\foodigo\\frontend\\")) {

                imagePath = imagePath.replace(
                    "C:\\foodigo\\frontend\\",
                    "./"
                );

                imagePath = imagePath.replaceAll("\\", "/");
            }

            const foodCard =
                document.createElement("div");

            foodCard.className = "food-card";

            // =================================
            // CHECK FOOD AVAILABILITY
            // =================================

            let buttonHTML = "";

            if (food.is_available === false) {

                buttonHTML = `
                    <button
                        disabled
                        style="
                            background: #999;
                            color: white;
                            cursor: not-allowed;
                            opacity: 0.7;
                        "
                    >
                        Not Available
                    </button>
                `;

            } else {

                buttonHTML = `
                    <button
                        onclick="addFoodToCart(
                            '${food.name.replace(/'/g, "\\'")}',
                            ${Number(food.price)}
                        )"
                    >
                        Add to Cart
                    </button>
                `;

            }

            foodCard.innerHTML = `

                <img
                    src="${imagePath}"
                    alt="${food.name}"
                >

                <div class="food-info">

                    <h3>${food.name}</h3>

                    <p>
                        ${food.description || ""}
                    </p>

                    <p>
                        ₹${food.price}
                    </p>

                    ${buttonHTML}

                </div>

            `;

            foodMenu.appendChild(foodCard);

        });

    } catch (error) {

        console.error(
            "LOAD RESTAURANT FOOD ERROR:",
            error
        );

    }

}

        function addFoodToCart(name, price) {

    // =========================
    // CHECK LOGIN
    // =========================

    let isLoggedIn =
        localStorage.getItem("isLoggedIn");

    if (isLoggedIn !== "true") {

        alert("Please login first to add items to cart.");

        window.location.href = "login.html";

        return;
    }


    // =========================
    // GET RESTAURANT ID
    // =========================

    const params =
        new URLSearchParams(window.location.search);

    const restaurantId =
        params.get("id");


    if (!restaurantId) {

        alert("Restaurant information not found.");

        return;
    }


    // =========================
    // GET CART
    // =========================

    let cart =
        JSON.parse(localStorage.getItem("cart")) || [];


    // =========================
    // CHECK EXISTING ITEM
    // =========================

    let existingItem =
        cart.find(function(item) {

            return (
                item.name === name &&
                item.restaurantId == restaurantId
            );

        });


    // =========================
    // INCREASE QUANTITY
    // =========================

    if (existingItem) {

        existingItem.quantity++;

    }


    // =========================
    // ADD NEW ITEM
    // =========================

    else {

        cart.push({

            name: name,

            price: price,

            quantity: 1,

            restaurantId: restaurantId

        });

    }


    // =========================
    // SAVE CART
    // =========================

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );


    alert(name + " added to cart!");

}
        
        function goBack() {

            window.location.href =
                "restaurants.html";

        }


        loadRestaurant();

    </script>

</body>

</html>
