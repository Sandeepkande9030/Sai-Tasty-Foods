        async function loadRestaurant() {

            const params =
                new URLSearchParams(window.location.search);

            const restaurantId =
                params.get("id");


            if (!restaurantId) {

                document.getElementById("restaurantDetails").innerHTML =
                    "<p>Restaurant not found.</p>";

                return;

            }


            try {

                const response =
                    await fetch(
                        "https://backend-dl8i.vercel.app/api/restaurants/"
                    );


                const data =
                    await response.json();


                if (!data.success) {

                    document.getElementById("restaurantDetails").innerHTML =
                        "<p>Unable to load restaurant.</p>";

                    return;

                }


                const restaurant =
                    data.restaurants.find(
                        function(item) {

                            return item.id == restaurantId;

                        }
                    );


                if (!restaurant) {

                    document.getElementById("restaurantDetails").innerHTML =
                        "<p>Restaurant not found.</p>";

                    return;

                }


                document.getElementById("restaurantName").innerText =
                    restaurant.name;


                document.getElementById("restaurantDetails").innerHTML = `

                    <div class="food-card">

                        <img
                            src="${restaurant.image}"
                            alt="${restaurant.name}"
                        >

                        <div class="food-info">

                            <h3>
                                ${restaurant.name}
                            </h3>

                            <p>
                                ${restaurant.description}
                            </p>

                            <p>
                                🍴 Cuisine:
                                ${restaurant.cuisine}
                            </p>

                            <p>
                                ⭐ Rating:
                                ${restaurant.rating}
                            </p>

                            <p>
                                🛵 Delivery:
                                ${restaurant.delivery_time}
                            </p>

                            <p>
                                📍 Location:
                                ${restaurant.location}
                            </p>

                            <button onclick="goBack()">
                                ← Back to Restaurants
                            </button>

                        </div>
<h2 style="margin-top: 40px;">
    Food Menu
</h2>

<div class="food-container" id="foodMenu">

    
        </div>

                
                `;
                    loadFoodMenu(restaurantId);

                            }

            catch (error) {
                console.error(error);

                document.getElementById("restaurantDetails").innerHTML =
                    "<p>Unable to connect to server.</p>";

            }

        }

        async function loadRestaurantAddedFood(restaurantId) {

    try {

        const response = await fetch(
            "https://backend-dl8i.vercel.app/api/restaurant-food-items/?restaurant_id=" +
            restaurantId
        );

        const data = await response.json();

        if (!data.success || data.food_items.length === 0) {
            return;
        }

        const foodMenu =
            document.getElementById("foodMenu");

        data.food_items.forEach(function(food) {

            let imagePath = food.image;

            if (!imagePath) {
                imagePath = "./images/food-background.jpg";
            }

            // Convert local Windows image path
            if (imagePath.includes("C:\\foodigo\\frontend\\")) {

                imagePath = imagePath.replace(
                    "C:\\foodigo\\frontend\\",
                    "./"
                );

                imagePath = imagePath.replaceAll("\\", "/");
            }

            const foodCard =
                document.createElement("div");

            foodCard.className = "food-card";

            foodCard.innerHTML = `

                <img
                    src="${imagePath}"
                    alt="${food.name}"
                >

                <div class="food-info">

                    <h3>${food.name}</h3>

                    <p>
                        ${food.description || ""}
                    </p>

                    <p>
                        ₹${food.price}
                    </p>

                    <button
                        onclick="addFoodToCart('${food.name.replace(/'/g, "\\'")}', ${food.price})">
                        Add to Cart
                    </button>

                </div>

            `;

            foodMenu.appendChild(foodCard);

        });

    } catch (error) {

        console.error(
            "LOAD RESTAURANT ADDED FOOD ERROR:",
            error
        );

    }

}

        function addFoodToCart(name, price) {

    // =========================
    // CHECK LOGIN
    // =========================

    let isLoggedIn =
        localStorage.getItem("isLoggedIn");

    if (isLoggedIn !== "true") {

        alert("Please login first to add items to cart.");

        window.location.href = "login.html";

        return;
    }


    // =========================
    // GET RESTAURANT ID
    // =========================

    const params =
        new URLSearchParams(window.location.search);

    const restaurantId =
        params.get("id");


    if (!restaurantId) {

        alert("Restaurant information not found.");

        return;
    }


    // =========================
    // GET CART
    // =========================

    let cart =
        JSON.parse(localStorage.getItem("cart")) || [];


    // =========================
    // CHECK EXISTING ITEM
    // =========================

    let existingItem =
        cart.find(function(item) {

            return (
                item.name === name &&
                item.restaurantId == restaurantId
            );

        });


    // =========================
    // INCREASE QUANTITY
    // =========================

    if (existingItem) {

        existingItem.quantity++;

    }


    // =========================
    // ADD NEW ITEM
    // =========================

    else {

        cart.push({

            name: name,

            price: price,

            quantity: 1,

            restaurantId: restaurantId

        });

    }


    // =========================
    // SAVE CART
    // =========================

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );


    alert(name + " added to cart!");

}
