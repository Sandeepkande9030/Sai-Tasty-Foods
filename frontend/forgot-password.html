
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - Sai Tasty Foods</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .forgot-container {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #e63946;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #c92f3b;
        }

        #forgotMessage {
            text-align: center;
            margin-top: 15px;
        }

        .back-login {
            display: block;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="forgot-container">

        <h2>Forgot Password</h2>

        <form id="forgotPasswordForm">

            <label for="forgotEmail">
                Enter your registered email
            </label>

            <input
                type="email"
                id="forgotEmail"
                placeholder="Enter your email"
                required
            >

            <button type="submit">
                Send OTP
            </button>

        </form>

        <p id="forgotMessage"></p>

        <a href="login.html" class="back-login">
            Back to Login
        </a>

    </div>

    <script src="script.js"></script>

</body>

</html>
