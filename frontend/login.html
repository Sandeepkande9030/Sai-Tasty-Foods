<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">


<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Login - Sai Tasty Foods</title>

<link rel="stylesheet" href="./style.css">

</head>

<body>

<!-- Navigation Bar -->
<header>

    <div class="logo">
        SAI TASTY FOODS
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="#">Restaurants</a>
        <a href="#">Offers</a>
        <a href="login.html" id="loginLink">Login</a>
         <a href="cart.html" id="cartLink" style="display: none;"></a>
    </nav>

</header>


<!-- Login Section -->
<section class="login-section">

    <div class="login-container">

        <h2>Welcome</h2>

        <p>Login to Sai Tasty Foods </p>

        <form id="loginForm">

            <label for="email">Email</label>

            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
                required
            >


            <label for="password">Password</label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>


        <p id="loginMessage"></p>


        <div class="register-link">

            <p>
                Don't have an account?
                <a href="register.html">Create Account</a>
            </p>

        </div>

    </div>

</section>


<script src="./script.js"></script>

</body>

</html>
